[package]
name = "tabloc"
version = "0.1.0"
edition = "2024"

[lib]
name = "tablo"
path = "src/lib.rs"

[[bin]]
name = "tabloc"
path = "src/bin/tabloc.rs"
required-features = ["compiler"]

[[bin]]
name = "tablo"
path = "src/bin/tablo.rs"
required-features = ["compiler"]

[[bin]]
name = "tablodbg"
path = "src/bin/tablodbg.rs"
required-features = ["compiler"]

[[bin]]
name = "tablolsp"
path = "src/bin/tablolsp.rs"
required-features = ["compiler"]

[features]
default = ["compiler", "driver-mysql", "driver-postgresql", "driver-sqlite"]
compiler = ["dep:clap", "dep:colored", "dep:serde_json", "dep:sha2", "dep:tempfile"]
driver-mysql = ["dep:mysql"]
driver-postgresql = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]
driver-sqlite = ["dep:rusqlite"]

[dependencies]
clap = { version = "4.5.60", features = ["derive"], optional = true }
colored = { version = "3", optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"], optional = true }
native-tls = { version = "0.2", optional = true }
postgres = { version = "0.19", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
time = { version = "0.3", features = ["local-offset"] }
toml = "0.8"

[[example]]
name = "build_executable"
path = "examples/build_executable.rs"
required-features = ["compiler"]
